<!DOCTYPE html>
<html lang="en">

<head>
    <!-- [Your existing head content] -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Sisterly - Contact Us</title>
    <link rel="icon" href="images/logo-fullcolor.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Bad+Script&family=Montserrat:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.3/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header class="columns is-vcentered">
        <!-- [Your existing header content] -->
    </header>

    <!-- Our Commitment Section -->
    <section class="content-container contact-hero-section">
        <!-- [Your existing hero section content] -->
    </section>

    <section id="contact-section" class="section">
        <div class="container">
            <div class="columns is-vcentered">
                <!-- Contact Information -->
                <div class="column is-4 contact-info">
                    <!-- [Your existing contact info content] -->
                </div>

                <!-- Contact Form -->
                <div class="column is-1"></div>
                <div class="column is-7 contact-form">
                    <h2 class="contact-section-title">
                        <img src="images/heart.svg" alt="Heart Icon" class="heart-icon-inline">
                        <span class="vision-mission-title-text">Send&nbsp;Us&nbsp;a&nbsp;Message</span>
                    </h2>
                    <form id="contactForm"
                        action="https://docs.google.com/forms/d/e/1FAIpQLSc55KDebVBs-eiqega2D9VcQgOQPFJYsQjFaszgWpejgiv7tA/formResponse"
                        method="POST" target="hidden_iframe">

                        <!-- Name Field -->
                        <div class="field">
                            <label for="name" class="label">Name</label>
                            <div class="control">
                                <input class="input" type="text" id="name" name="entry.1341531154" required>
                            </div>
                        </div>

                        <!-- Email Field -->
                        <div class="field">
                            <label for="email" class="label">Email</label>
                            <div class="control">
                                <input class="input" type="email" id="email" name="entry.421031404" required>
                            </div>
                        </div>

                        <!-- Phone Field -->
                        <div class="field">
                            <label for="phone" class="label">Phone</label>
                            <div class="control">
                                <input class="input" type="tel" id="phone" name="entry.48590396" required>
                            </div>
                        </div>

                        <!-- Message Field -->
                        <div class="field">
                            <label for="message" class="label">Message</label>
                            <div class="control">
                                <textarea class="textarea" id="message" name="entry.1829719757" rows="5"
                                    required></textarea>
                            </div>
                        </div>

                        <!-- Math CAPTCHA Field -->
                        <div class="field">
                            <label class="label" id="captcha-question" for="captcha-answer"></label>
                            <!-- Initially empty -->
                            <div class="control">
                                <input class="input" type="number" id="captcha-answer" name="captcha_answer" required
                                    aria-describedby="captcha-error">
                            </div>
                            <p class="help is-danger" id="captcha-error" style="display: none;">
                                Incorrect answer. Please try again.
                            </p>
                        </div>

                        <!-- Submit Button -->
                        <div class="control">
                            <button id="submitBtn" class="button is-info is-fullwidth" type="submit"
                                disabled>Send</button>
                        </div>
                    </form>

                    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

                    <!-- Placeholder for Success Message -->
                    <div id="form-messages" style="margin-top: 20px;"></div>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <!-- [Your existing footer content] -->
    </footer>

    <script src="js/contact.js"></script>
    <!-- Cloudflare Web Analytics -->
    <script defer src='https://static.cloudflareinsights.com/beacon.min.js'
        data-cf-beacon='{"token": "a930ccbd3ac84e9c8fc398cf8ebc5a56"}'></script>
    <!-- End Cloudflare Web Analytics -->
</body>

</html>
